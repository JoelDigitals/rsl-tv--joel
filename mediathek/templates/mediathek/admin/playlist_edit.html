{% extends "mediathek/admin/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">{% if playlist %}Playlist bearbeiten{% else %}Neue Playlist{% endif %}</div>
    
    <form method="post" style="padding:1rem 0;">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Titel *</label>
            <input type="text" name="title" class="form-input" value="{{ playlist.title|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Beschreibung</label>
            <textarea name="description" class="form-textarea">{{ playlist.description|default:'' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">🎬 YouTube Playlist URL</label>
            <input type="url" name="youtube_playlist_url" class="form-input" value="{{ playlist.youtube_playlist_url|default:'' }}" placeholder="https://www.youtube.com/playlist?list=PLxxxxx">
            <small style="color:var(--rsl-muted); display:block; margin-top:0.5rem;">
                Optional: YouTube Playlist-URL für automatischen Import
            </small>
        </div>
        
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" name="auto_import" id="auto_import" {% if playlist.auto_import %}checked{% endif %}>
                <label for="auto_import">Automatischer Import (Playlist regelmäßig aktualisieren)</label>
            </div>
        </div>
        
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" name="is_active" id="is_active" {% if not playlist or playlist.is_active %}checked{% endif %}>
                <label for="is_active">Aktiv</label>
            </div>
        </div>
        
        <div style="display:flex; gap:1rem; margin-top:2rem;">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Speichern
            </button>
            <a href="{% url 'mediathek:custom_admin_playlists' %}" class="btn btn-outline">
                <i class="bi bi-x-circle"></i> Abbrechen
            </a>
        </div>
    </form>
</div>
{% endblock %}
