{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-center align-items-center gap-2 mt-4 flex-wrap" aria-label="Seiten">
    {% if page_obj.has_previous %}<a class="btn btn-ghost" href="?{% if current_reihe %}reihe={{ current_reihe }}&amp;{% endif %}seite={{ page_obj.previous_page_number }}"><i class="bi bi-chevron-left"></i>Zurück</a>{% endif %}
    <span style="color:var(--text-2)">Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-ghost" href="?{% if current_reihe %}reihe={{ current_reihe }}&amp;{% endif %}seite={{ page_obj.next_page_number }}">Weiter<i class="bi bi-chevron-right"></i></a>{% endif %}
</nav>
{% endif %}
