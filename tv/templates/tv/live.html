{% extends 'base.html' %}
{% load static %}

{% block title %}Live-Stream - RSL TV{% endblock %}

{% block extra_css %}
<style>
    /* DUNKLES, LESBARES DESIGN */
    body {
        background: #0a0a0a;
        color: #f0f0f0;
        font-size: 18px;
    }

    .hero-section {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        padding: 60px 0;
        margin-bottom: 40px;
        border-bottom: 3px solid #e94560;
    }

    .hero-section h1 {
        font-size: 48px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 16px;
    }

    .live-badge {
        display: inline-block;
        background: #ff0000;
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }

    .stream-container {
        background: #1a1a1a;
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        border: 2px solid #333;
    }

    .stream-selector {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
    }

    .stream-button {
        flex: 1;
        padding: 16px 24px;
        border-radius: 8px;
        border: 2px solid #333;
        background: #1a1a1a;
        color: #f0f0f0;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .stream-button:hover {
        border-color: #e94560;
        background: #2a2a2a;
    }

    .stream-button.active {
        background: #e94560;
        border-color: #e94560;
        color: white;
    }

    .stream-embed {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        background: #000;
        border-radius: 8px;
    }

    .stream-embed iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="hero-section">
    <div class="container text-center">
        {% if live_streams %}
            <div class="live-badge">🔴 LIVE</div>
        {% endif %}
        <h1>📺 Live-Stream</h1>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-lg-8">
            <div class="stream-container">
                <div class="stream-selector">
                    <button class="stream-button active" onclick="showRSL(this)">
                        📺 RSL Live
                    </button>
                    <button class="stream-button" onclick="showTwitch(this)">
                        🎮 Twitch
                    </button>
                </div>
                
                <!-- RSL Studio Live Embed (ersetzt YouTube) -->
                <div id="rsl-stream" class="stream-embed">
                    <iframe src="https://rsl-studio-live.lovable.app/embed" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0"></iframe>

                </div>
                
                <!-- Twitch Stream -->
                <div id="twitch-stream" class="stream-embed" style="display: none;">
                    <iframe 
                        src="https://player.twitch.tv/?channel={{ twitch_channel }}&parent={{ request.get_host }}&autoplay=true" 
                        allowfullscreen style="width:100%;aspect-ratio:16/9;border:0">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function showRSL(btn) {
    document.getElementById('rsl-stream').style.display = 'block';
    document.getElementById('twitch-stream').style.display = 'none';
    document.querySelectorAll('.stream-button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function showTwitch(btn) {
    document.getElementById('rsl-stream').style.display = 'none';
    document.getElementById('twitch-stream').style.display = 'block';
    document.querySelectorAll('.stream-button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
</script>
{% endblock %}
