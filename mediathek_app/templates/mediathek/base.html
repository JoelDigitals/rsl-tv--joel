{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title }}{% endblock %} - RSL TV</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
          --rsl-blue:       #0a6eb4;
          --rsl-blue-dark:  #073e6e;
          --rsl-blue-deep:  #041c36;
          --rsl-blue-light: #1a8fd1;
          --rsl-steel:      #1d5a82;
          --rsl-sky:        #5baed4;
          --rsl-dark:       #070d14;
          --rsl-darker:     #040810;
          --rsl-panel:      #0d1a27;
          --rsl-panel2:     #111f30;
          --rsl-border:     #162842;
          --rsl-border2:    #1e3a56;
          --rsl-text:       #ffffff;
          --rsl-muted:      #a8c4d9;
          --rsl-bright:     #ffffff;
          --rsl-accent:     #00c4ff;
          --rsl-live:       #e63946;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background: var(--rsl-dark);
            color: var(--rsl-text);
            font-family: 'Barlow', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* NAVBAR */
        .rsl-navbar {
            background: linear-gradient(180deg, var(--rsl-darker) 0%, rgba(4,8,16,0.98) 100%);
            border-bottom: 2px solid var(--rsl-blue);
            position: sticky;
            top: 0;
            z-index: 300;
            box-shadow: 0 2px 24px rgba(10,110,180,0.35);
        }
        
        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 62px;
        }
        
        .rsl-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex-shrink: 0;
        }
        
        .logo-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .logo-tag {
            font-size: 0.55rem;
            color: var(--rsl-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: block;
        }
        
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex: 1;
        }
        
        .nav-links a {
            color: var(--rsl-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--rsl-accent);
        }
        
        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            background: var(--rsl-panel);
            border: 1px solid var(--rsl-border);
            color: #fff;
            padding: 0.5rem 2.5rem 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 200px;
            transition: all 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--rsl-blue);
            width: 280px;
        }
        
        .search-box button {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--rsl-muted);
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-rsl {
            background: linear-gradient(135deg, var(--rsl-blue-dark), var(--rsl-blue-light));
            color: #fff;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.5rem 1.25rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }
        
        .btn-rsl:hover {
            background: linear-gradient(135deg, var(--rsl-blue-light), var(--rsl-accent));
            box-shadow: 0 4px 16px rgba(10,110,180,0.4);
            transform: translateY(-1px);
        }
        
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }
        
        ::-webkit-scrollbar {
            width: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--rsl-darker);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--rsl-blue);
            border-radius: 3px;
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="rsl-navbar">
        <div class="nav-inner">
            <a class="rsl-logo" href="{% url 'mediathek:home' %}">
                <div>
                    <div class="logo-name">RSL</div>
                    <span class="logo-tag">von Joel Digitals</span>
                </div>
            </a>
            
            <div class="nav-links">
                <a href="{% url 'mediathek:home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Mediathek</a>
                <a href="{% url 'mediathek:video_list' %}" {% if 'video' in request.resolver_match.url_name %}class="active"{% endif %}>Videos</a>
                <a href="{% url 'mediathek:series_list' %}" {% if 'series' in request.resolver_match.url_name or 'season' in request.resolver_match.url_name or 'episode' in request.resolver_match.url_name %}class="active"{% endif %}>Serien</a>
                <a href="{% url 'mediathek:live_overview' %}" {% if 'live' in request.resolver_match.url_name %}class="active"{% endif %}>Live</a>
                <a href="{% url 'mediathek:playlist_list' %}" {% if 'playlist' in request.resolver_match.url_name %}class="active"{% endif %}>Playlists</a>
            </div>
            
            <div class="nav-right">
                <div class="search-box">
                    <form action="{% url 'mediathek:search' %}" method="get">
                        <input type="text" name="q" placeholder="Suchen..." value="{{ search_query|default:'' }}">
                        <button type="submit"><i class="bi bi-search"></i></button>
                    </form>
                </div>
                
                {% if user.is_staff %}
                <a href="/admin/" class="btn-rsl">
                    <i class="bi bi-gear"></i> ADMIN
                </a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <!-- CONTENT -->
    {% block content %}{% endblock %}
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
